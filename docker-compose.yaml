services:
  cloudflare-ddns-updater:
    container_name: cloudflare-ddns-updater
    restart: always
    image: "ghcr.io/krzysztoff27/cloudflare-ddns-updater:latest"
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ZONE_ID=${ZONE_ID}
      - RECORD_ID=${RECORD_ID}
      - NAME=${NAME}
      - TTL=${TTL}
      - TYPE=${TYPE}
      - TIME_INTERVAL=${TIME_INTERVAL}
