name: cloudflare-ddns-updater

on:
    release:
        types:
            - published

jobs:
    #Check for a release wtith the "target" property set to the API branch
    build-and-push:
        if: github.event.release.target_commitish == 'main'

        runs-on: ubuntu-latest

        permissions:
          contents: read
          packages: write

        env:
          OWNER: ${{ github.repository_owner }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ghcr.io/${{ env.OWNER }}/cloudflare-ddns-updater
              
            - name: Downcase repository owner name
              run: |
                echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

            - name: Build and push Cloudflare-DDNS-Updater Docker image
              uses: docker/build-push-action@v4
              with:
                context: ./docker
                file: docker/dockerfile
                push: true
                tags: |
                  ghcr.io/${{ env.OWNER }}/cloudflare-ddns-updater:${{ github.ref_name }}
                  ghcr.io/${{ env.OWNER }}/cloudflare-ddns-updater:latest
                labels: ${{ steps.meta.outputs.labels }}